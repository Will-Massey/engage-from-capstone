# =============================================================================
# Unified CI/CD Pipeline for Engage
#
# The ONLY deploy path: lint → test → e2e must be green on master, then this
# workflow triggers the Render deploys via API (autoDeploy is off in
# render.yaml). Red CI never deploys.
# =============================================================================
name: CI/CD

# NOTE: deliberately no paths-ignore. "Lint & Type Check" and "Test Suite" are
# required by branch protection, and a workflow that never runs never reports
# them — which left every docs-only PR permanently stuck at "Expected — waiting
# for status to be reported". The jobs therefore always run and decide inside
# whether there is any code to check (see the `changes` job). Skipping at the
# job level would not work either: a skipped required check does not satisfy
# branch protection.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cost control: supersede in-flight CI when a newer commit lands on the same
# ref (rapid pushes were burning the free Actions minutes allowance).
# Cancel only PR runs — a master run can be mid-deploy (Neon backup, backend
# then frontend), and a run-level cancel would kill it despite the deploy
# job's own non-cancelling group. Master runs queue instead.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default token scope: read-only. Jobs that need more (e.g. the
# deploy-failure alert opening an issue) escalate at job level.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # CI JOBS
  # ==========================================================================

  # Decides whether this push/PR touches anything worth building. Docs-only
  # changes still report the required contexts as green, but skip the work.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # Fail safe: anything we cannot diff (new branch, force push, manual
          # dispatch) is treated as a code change and gets the full pipeline.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base ref — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"; echo "$FILES"
          CODE=$(echo "$FILES" | grep -vE '(\.mdx?$|^docs/|^\.claude/|^landing/)' || true)

          if [ -n "$CODE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changed — full pipeline."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only — required checks will report green without building."
          fi

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      # backend/frontend typecheck resolve @uk-proposal-platform/shared types
      # from shared/dist and @prisma/client from the generated client — build
      # them explicitly (a postinstall tsc used to do this, but running tsc
      # mid-install breaks Render's production npm ci).
      - name: Build shared
        if: needs.changes.outputs.code == 'true'
        run: npm run build:shared

      - name: Generate Prisma Client
        if: needs.changes.outputs.code == 'true'
        run: cd backend && npx prisma generate

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint

      - name: Type check
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: npm run format:check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # `changes` must be in needs, not just `lint`: the step guards below read
    # needs.changes.outputs.code, and an unreachable job reference resolves to
    # empty — which would silently skip the entire suite while reporting green.
    needs: [changes, lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: engage_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      - name: Build shared
        if: needs.changes.outputs.code == 'true'
        run: npm run build:shared

      - name: Generate Prisma Client
        if: needs.changes.outputs.code == 'true'
        run: cd backend && npx prisma generate

      - name: Run migrations
        if: needs.changes.outputs.code == 'true'
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/engage_test

      - name: Seed test database
        if: needs.changes.outputs.code == 'true'
        run: cd backend && npx tsx prisma/seed-enhanced.ts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/engage_test

      - name: Run unit tests with coverage
        if: needs.changes.outputs.code == 'true'
        # Smoke suites import the full app; collecting coverage on all src/**/*.ts
        # alongside them OOMs on the default ~4GB heap. Run smoke separately below.
        # --forceExit: singleton cache + Prisma hold open sockets after the suite.
        run: cd backend && npm test -- --coverage --forceExit --testPathIgnorePatterns=/smoke/
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/engage_test
          REDIS_URL: redis://localhost:6379
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run smoke tests
        if: needs.changes.outputs.code == 'true'
        # Each smoke file boots the full Express app. Run one file per jest process
        # (not test:integration + testPathPattern — that still discovers all smoke
        # files and OOM'd at 4GB). Cap heap at 6GB — 8192 exceeds the 7GB runner.
        run: |
          cd backend
          for spec in tests/smoke/*.test.ts; do
            echo "Smoke: $spec"
            npx jest "$spec" --forceExit --coverage=false --runInBand
          done
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/engage_test
          # Omit REDIS_URL — after the coverage suite the service container is
          # often slow/offline; smoke only needs MemoryStore rate limiting.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Frontend unit tests
        if: needs.changes.outputs.code == 'true'
        run: cd frontend && npx vitest run

      - name: Upload coverage
        if: needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Playwright E2E is the most expensive job (~7–15 min). Run it only as the
  # deploy gate on master / manual dispatch — not on every PR (lint+unit cover PRs).
  e2e:
    name: E2E Tests (Playwright)
    needs: [changes, lint, test]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/playwright-e2e.yml
    secrets: inherit

  # ==========================================================================
  # CD — single deploy path, gated on green CI
  # ==========================================================================

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # e2e is skipped on PRs; on master push it must succeed before deploy.
    needs: [changes, lint, test, e2e]
    # Docs-only commits must not ship a release. paths-ignore used to prevent
    # this by stopping the whole workflow; the job now declines for itself.
    if: >-
      needs.changes.outputs.code == 'true'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/master'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://capstonesoftware.co.uk/engage
    steps:
      - name: Record pre-deploy rollback point
        # Production data lives in the Render Postgres `engage-db`
        # (dpg-d6qkjbma2pns73a2qoe0-a, database engage_production, PG 18) — NOT
        # in Neon. This step used to snapshot a Neon project that turned out to
        # be a stale July copy: it backed up nothing that matters and, worse, it
        # passed, so every deploy looked protected when it was not.
        #
        # It deliberately does NOT pg_dump into a CI artifact. That would export
        # UK accountancy client records into GitHub artifact storage, which is a
        # data-protection problem rather than a backup; the runner's Postgres
        # client is also older than the server and would refuse the dump anyway.
        #
        # What this does instead: capture the currently-live deploy so a bad
        # release can be reverted immediately, and surface the database the
        # release is about to migrate. Data-level restore is Render's own
        # backup for engage-db — see docs/ROLLBACK_RUNBOOK.md.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          set -uo pipefail
          # Never fail the release on this step: it records a rollback point, it
          # is not a gate. A missing marker is worth a warning, not a blocked
          # deploy — the failure mode this file already suffered once today.
          LIVE=$(curl -sf "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=20" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | jq -r '[.[].deploy | select(.status == "live")][0]' 2>/dev/null || echo "")

          if [ -z "$LIVE" ] || [ "$LIVE" = "null" ]; then
            echo "::warning::No currently-live deploy found — first deploy, or the API shape changed."
            echo "ROLLBACK_DEPLOY_ID=" >> "$GITHUB_ENV"
            exit 0
          fi

          ID=$(jq -r '.id' <<<"$LIVE")
          SHA=$(jq -r '.commit.id // "unknown"' <<<"$LIVE")
          echo "ROLLBACK_DEPLOY_ID=$ID" >> "$GITHUB_ENV"

          {
            echo "### Pre-deploy rollback point"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Roll back to deploy | \`$ID\` |"
            echo "| Which is commit | \`${SHA:0:12}\` |"
            echo "| Deploying commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Database being migrated | \`engage_production\` on \`engage-db\` (Render) |"
            echo ""
            echo "Code rollback: Render dashboard → engage-backend → Deploys → Redeploy \`$ID\`."
            echo "Data restore: Render dashboard → engage-db → Backups (Neon holds nothing current)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Rollback point: deploy $ID (commit ${SHA:0:12})"

      - name: Deploy backend and wait until live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          DEPLOY_ID=$(curl -sf -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}' | jq -r '.id')
          echo "Backend deploy: $DEPLOY_ID"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for backend deploy"; exit 1

      - name: Deploy frontend and wait until live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          DEPLOY_ID=$(curl -sf -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}' | jq -r '.id')
          echo "Frontend deploy: $DEPLOY_ID"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for frontend deploy"; exit 1

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            curl -sf https://engage-backend-e1ue.onrender.com/health && exit 0
            sleep 10
          done
          echo "Backend health check failed after deploy"; exit 1

  # ==========================================================================
  # Alerting — a failed deploy opens a GitHub issue (the Jul 2026 env-var
  # outage went unnoticed for 3 days because failures were email-only)
  # ==========================================================================

  alert-on-deploy-failure:
    name: Alert on deploy failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create deploy-failure --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Production deploy failed" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🚨 Production deploy failed — ${GITHUB_SHA:0:7}" \
            --label deploy-failure \
            --body "The \`Deploy to Render\` job failed for \`${GITHUB_SHA}\`.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Production keeps serving the previous build on \`update_failed\`, but nothing new deploys until this is fixed. Check the Render dashboard deploy log for the boot error (see docs/ROLLBACK_RUNBOOK.md)."
