# Full-stack E2E on demand only (weekday schedule disabled — Playwright full
# suite is expensive; master deploy CI already runs E2E before each ship).
name: E2E Scheduled

on:
  workflow_dispatch:

concurrency:
  group: e2e-scheduled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: ./.github/workflows/playwright-e2e.yml
    secrets: inherit
