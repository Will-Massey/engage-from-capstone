name: Android release AAB

# Builds a SIGNED Android App Bundle for the Play Store. Manual only — a
# release is a deliberate act, never a side effect of a push.
#
# This does NOT upload to Play. It produces the .aab as an artifact; the
# upload is a separate, human step until a Play service account is wired in
# (Graft's scripts/play-release.mjs is the pattern to copy when it is).
#
# REQUIRED REPO SECRETS (all four, or the run fails fast with a clear message):
#   ANDROID_KEYSTORE_BASE64   the upload keystore, base64 encoded
#                             (`base64 -w0 engage-upload.keystore` on Linux,
#                              [Convert]::ToBase64String on Windows)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
#
# The keystore itself lives ONLY in William's password manager and in these
# secrets. Losing it means Google has to reset the upload key before any
# further release can ship, so back it up before the first release.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Android versionCode (must be higher than the last one uploaded to Play)'
        required: true
        default: '1'
      versionName:
        description: 'Version name shown to users, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast when signing secrets are missing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — see this workflow's header."
            exit 1
          fi

      # Capacitor 7 requires JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      # Loads frontend/.env.capacitor: the absolute VITE_API_URL the native
      # WebView needs, since it is cross-origin to the API.
      - name: Build web + sync Capacitor (android)
        run: cd frontend && npm run cap:sync:android

      - name: Apply release version
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          cd frontend/android/app
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION_NAME}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      # keystore.properties is gitignored; the gradle config reads it when
      # present and leaves the build unsigned when it is not.
      - name: Materialise the upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd frontend/android
          echo "$KEYSTORE" | base64 -d > engage-upload.keystore
          cat > keystore.properties <<EOF
          storeFile=engage-upload.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed AAB
        run: |
          chmod +x frontend/android/gradlew
          cd frontend/android
          ./gradlew bundleRelease --no-daemon

      # Prove it is actually signed and carries the web bundle, before anyone
      # tries to upload it to Play and gets a rejection hours later.
      - name: Verify the bundle
        run: |
          AAB=frontend/android/app/build/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" | grep -q "base/assets/public/index.html"
          unzip -l "$AAB" | grep -qE "base/assets/public/assets/index-[A-Za-z0-9_-]+\.js"
          unzip -l "$AAB" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC" \
            || { echo "::error::AAB is not signed"; exit 1; }
          echo "bundle carries the web assets and is signed"

      - name: Remove signing material from the workspace
        if: always()
        run: rm -f frontend/android/engage-upload.keystore frontend/android/keystore.properties

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: engage-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
