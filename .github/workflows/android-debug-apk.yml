name: Android debug APK

# Builds an installable DEBUG apk of the Engage Android shell for on-device
# testing. Debug builds are signed with Android's auto-generated debug
# keystore, so this needs NO secrets. Trigger from the Actions tab
# ("Run workflow"), download the "engage-debug-apk" artifact and sideload it.
#
# This machine-independent path exists because local dev boxes may have no
# JDK/Android SDK — CI is the canonical Android build environment.
#
# Not a release build — do not ship this to a store. The release workflow
# (signed AAB + Play upload) follows Graft's scripts/play-release.mjs pattern
# and needs: an Engage upload keystore (mint on a machine with a JDK — this
# repo has none checked in), Play Console app, and signing secrets. TODO when
# William green-lights the Play listing.
#
# workflow_dispatch only — no schedule (Actions minutes are budgeted).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 7 requires JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Workspaces monorepo: root install covers frontend + shared; the
      # frontend build resolves @uk-proposal-platform/shared from shared/dist,
      # so shared must build first (same order as ci-cd.yml).
      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      # cap:sync:android = vite build --mode capacitor (loads
      # frontend/.env.capacitor: absolute VITE_API_URL — the native WebView is
      # cross-origin, a relative /api fails on device) + npx cap sync android,
      # which copies dist into android/app/src/main/assets/public.
      - name: Build web + sync Capacitor (android)
        run: cd frontend && npm run cap:sync:android

      - name: Assemble debug APK
        run: |
          chmod +x frontend/android/gradlew
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      # An APK is a zip: prove the web bundle actually shipped inside before
      # anyone sideloads a shell around a blank WebView.
      - name: Verify web assets inside the APK
        run: |
          APK=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q "assets/public/index.html"
          unzip -l "$APK" | grep -qE "assets/public/assets/index-[A-Za-z0-9_-]+\.js"
          echo "web bundle present in APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engage-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
